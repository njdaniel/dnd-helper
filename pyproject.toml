[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dnd-helper"
version = "0.1.0"
description = "An AI co-DM Discord bot for tabletop RPG campaigns"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "aiosqlite",
    "alembic",
    "anthropic",
    "discord.py>=2.4",
    "ollama",
    "pydantic>=2",
    "pydantic-settings",
    "python-dotenv",
    "sqlalchemy[asyncio]>=2",
]

[project.optional-dependencies]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: hits a real local model; deselected by default. Run with OLLAMA_LIVE_TEST=1 pytest -m live",
]

