[alembic]
script_location = bot/db/migrations
prepend_sys_path = .
# Placeholder only — DATABASE_URL from the environment (or .env) overrides
# this at runtime. See bot/db/migrations/env.py.
sqlalchemy.url = sqlite+aiosqlite:///./dnd_helper.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
